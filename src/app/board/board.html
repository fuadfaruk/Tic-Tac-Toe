<div class="app-container">
  <header class="app-header">
    <h1>Current Player: {{ player }}</h1>
    <div class="controls">
      <button class="start-btn" (click)="newGame()">START NEW GAME</button>
    </div>
    <div *ngIf="winner" class="status-text">Player {{ winner }} won the game!</div>
  </header>

  <main>
    <app-square
      *ngFor="let val of squares; let i = index"
      [value]="val"
      (click)="makeMove(i)">

    </app-square>
  </main>
</div>
